name: game_engine
description: "Flutter module embedded in native Android/iOS apps via add-to-app."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.8.1

workspace:
  - packages/coreapp
  - packages/play_game

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  coreapp:
    path: packages/coreapp
  play_game:
    path: packages/play_game
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  dio: ^5.4.3
  pretty_dio_logger: ^1.3.1
  signalr_core: ^1.1.1
  connectivity_plus: ^6.0.3
  internet_connection_checker_plus: ^2.5.1
  shared_preferences: ^2.2.3
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0
  equatable: ^2.0.5
  pointycastle: ^3.9.1
  asn1lib: ^1.5.8

dependency_overrides:
  web: ^1.1.0
  web_socket_channel: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.9
  riverpod_generator: ^2.4.0
  freezed: ^2.5.2
  json_serializable: ^6.8.0
  melos: ^8.3.0

melos:
  useRootAsPackage: true
  categories:
    app:
      - "."
    packages:
      - "packages/**"
  scripts:
    analyze:
      exec: flutter analyze
    get:
      exec: flutter pub get

flutter:
  uses-material-design: true

  # Assets and fonts live in coreapp and are inherited automatically.

  module:
    androidX: true
    androidPackage: com.example.game_engine
    iosBundleIdentifier: com.hasanhasanat.gameEngine
