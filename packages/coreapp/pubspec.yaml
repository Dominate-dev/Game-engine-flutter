  # Font kit shared by every game plugin — any package/app that depends on
  # coreapp gets these families for free (Flutter merges dependency fonts
  # automatically), so game plugins never need to redeclare or re-bundle them.
  fonts:
    - family: EnLight
      fonts:
        - asset: assets/fonts/en_light_font.ttf
    - family: EnRegular
      fonts:
        - asset: assets/fonts/en_regular_font.ttf
    - family: EnMedium
      fonts:
        - asset: assets/fonts/en_medium_font.ttf
    - family: EnBold
      fonts:
        - asset: assets/fonts/en_bold_font.ttf
    - family: EnExtraBold
      fonts:
        - asset: assets/fonts/en_extra_bold.ttf
    - family: ArLight
      fonts:
        - asset: assets/fonts/ar_light_font.ttf
    - family: ArRegular
      fonts:
        - asset: assets/fonts/ar_regular_font.ttf
    - family: ArMedium
      fonts:
        - asset: assets/fonts/ar_medium_font.ttf
    - family: ArSemiBold
      fonts:
        - asset: assets/fonts/ar_semibold_font.ttf
    - family: ArBold
      fonts:
        - asset: assets/fonts/ar_bold_font.ttf
    - family: GameIcons
      fonts:
        - asset: assets/fonts/ic_medum_game.otf
    - family: Numbers
      fonts:
        - asset: assets/fonts/numbers.ttf
