name: coreapp
description: >
  Shared core plugin for all game plugins — API client, SignalR socket
  service, connectivity/reconnection handling, storage, and base
  presentation widgets (BaseState, BaseDialog, BaseSheet, loader overlay).
  Every game plugin depends on this package; it contains no game-specific
  logic.
version: 1.0.0
publish_to: 'none'
resolution: workspace

environment:
  sdk: ^3.8.1
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  dio: ^5.4.3
  pretty_dio_logger: ^1.3.1
  signalr_core: ^1.1.1
  http: ^1.2.0
  connectivity_plus: ^6.0.3
  internet_connection_checker_plus: ^2.5.1
  shared_preferences: ^2.2.3
  equatable: ^2.0.5
  pointycastle: ^3.9.1
  asn1lib: ^1.5.8
  flutter_spinkit: ^5.2.1
  flutter_svg: ^2.0.10+1
  chucker_flutter: ^1.8.5
  lottie: ^3.3.1
  share_plus: ^12.0.0
  url_launcher: ^6.3.1
  just_audio: ^0.10.6

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true

